<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 주문 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:800px;height:1280px;box-sizing:border-box;background:#F7F3EE;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:96px;flex:none;box-sizing:border-box;padding:0 32px;background:#FFFFFF;border-bottom:1px solid #E5DACE;display:flex;align-items:center;gap:20px">
<button aria-label="메뉴로 돌아가기" style="height:56px;padding:0 22px;border:1px solid #DCCFC2;border-radius:28px;background:#FFFFFF;font-family:inherit;font-size:20px;font-weight:500;color:#2B1D16">‹ 메뉴로</button>
<span style="font-size:34px;font-weight:700">주문 내역 확인</span>
</div>

<div style="flex:none;box-sizing:border-box;padding:28px 32px 12px;display:flex;align-items:center;justify-content:space-between">
<span style="display:flex;align-items:center;gap:12px;font-size:20px;color:#6B5A4E"><span style="height:40px;padding:0 16px;border-radius:12px;background:#5A3A28;color:#FFFFFF;font-size:20px;font-weight:700;display:flex;align-items:center">매장</span>음료 3잔</span>
<button style="height:48px;padding:0 20px;border:0;background:transparent;font-family:inherit;font-size:20px;font-weight:500;color:#B42318">전체 삭제</button>
</div>

<div style="flex:1;min-height:0;box-sizing:border-box;padding:0 32px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="3">
<div style="box-sizing:border-box;background:#FFFFFF;border:1px solid #E5DACE;border-radius:20px;padding:20px;display:flex;align-items:center;gap:20px">
<div style="width:104px;height:104px;flex:none;border-radius:16px;background:{{line.tint}};display:flex;align-items:center;justify-content:center;font-size:15px;color:#6B5A4E">사진</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:10px">
<span style="font-size:22px;font-weight:700;line-height:30px">{{line.name}}</span>
<span style="height:28px;padding:0 10px;border-radius:8px;background:{{line.tempBg}};color:{{line.tempInk}};font-size:15px;font-weight:700;display:flex;align-items:center">{{line.temp}}</span>
</div>
<div style="font-size:18px;line-height:26px;color:#6B5A4E">{{line.option}}</div>
<button style="align-self:flex-start;height:44px;padding:0 16px;border:1px solid #DCCFC2;border-radius:22px;background:#FFFFFF;font-family:inherit;font-size:17px;color:#2B1D16">옵션 변경</button>
</div>
<div style="align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between">
<button style="height:44px;padding:0 8px;border:0;background:transparent;font-family:inherit;font-size:18px;color:#6B5A4E">삭제</button>
<span style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700">{{line.total}}원</span>
</div>
</div>
</sc-for>
</div>

<div style="flex:none;box-sizing:border-box;padding:0 32px 12px">
<div style="box-sizing:border-box;border-radius:16px;background:#E3F7F2;padding:16px 20px;display:flex;align-items:center;gap:12px;font-size:19px;line-height:28px;color:#00473A">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#007A64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z"></path></svg>
<span>결제할 때 전화번호를 입력하면 음료 3잔 = 스탬프 3개가 적립돼요</span>
</div>
</div>

<div style="flex:none;box-sizing:border-box;padding:12px 32px 20px;display:flex;justify-content:space-between;align-items:baseline">
<span style="font-size:26px;font-weight:700">결제 금액</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:#5A3A28">16,600원</span>
</div>

<div style="height:128px;flex:none;box-sizing:border-box;padding:0 32px 24px;display:flex;gap:16px">
<button style="flex:1;height:88px;border:2px solid #5A3A28;border-radius:20px;background:#FFFFFF;color:#5A3A28;font-family:inherit;font-size:26px;font-weight:700">더 담기</button>
<button style="flex:2;height:88px;border:0;border-radius:20px;background:#5A3A28;color:#FFFFFF;font-family:inherit;font-size:26px;font-weight:700">결제하기 ›</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const hot = { tempBg: '#FDE8E6', tempInk: '#8F1D14' };
    const ice = { tempBg: '#E5EDFD', tempInk: '#1D3FA8' };
    return {
      lines: [
        { name: '아메리카노', temp: 'ICE', ...ice, option: '톨 · 샷 기본 · 얼음 보통 · 매장 컵', total: '4,700', tint: '#EADBCB' },
        { name: '카페 라떼', temp: 'ICE', ...ice, option: '그란데 · 시럽 없음 · 매장 컵', total: '5,800', tint: '#F1E6DA' },
        { name: '말차 라떼', temp: 'HOT', ...hot, option: '톨 · 매장 컵', total: '6,100', tint: '#DCEAD6' }
      ]
    };
  }
}
</script>
</body>
</html>
