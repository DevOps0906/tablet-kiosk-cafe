<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 소프트웨어형 주문 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F7F3EE;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:80px;flex:none;box-sizing:border-box;padding:0 24px;background:#FFFFFF;border-bottom:1px solid #E5DACE;display:flex;align-items:center;gap:16px">
<a href="sw-01-menu.dc.html" style="height:52px;box-sizing:border-box;padding:0 20px;border:1px solid #DCCFC2;border-radius:26px;font-size:18px;color:#2B1D16;text-decoration:none;display:flex;align-items:center">‹ 메뉴로</a>
<span style="font-size:30px;font-weight:900">주문 확인</span>
<span style="height:38px;padding:0 14px;border-radius:12px;background:#5A3A28;color:#FFFFFF;font-size:19px;font-weight:700;display:flex;align-items:center">매장</span>
<span style="flex:1"></span>
<span style="font-size:17px;color:#6B5A4E">[카페 이름] 커피</span>
</div>

<div style="flex:1;min-height:0;box-sizing:border-box;padding:24px;display:flex;gap:24px">

<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:20px;color:#6B5A4E">음료 3잔</span><button style="height:44px;padding:0 16px;border:0;background:transparent;font-family:inherit;font-size:18px;color:#B42318">전체 삭제</button></div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div style="height:128px;box-sizing:border-box;background:#FFFFFF;border:1px solid #E5DACE;border-radius:18px;padding:0 20px;display:flex;align-items:center;gap:18px">
<span style="width:88px;height:88px;flex:none;border-radius:16px;background:{{l.tint}}"></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px;font-weight:700">{{l.name}}</span><span style="height:28px;padding:0 10px;border-radius:8px;background:{{l.tempBg}};color:{{l.tempInk}};font-size:15px;font-weight:700;display:flex;align-items:center">{{l.temp}}</span></div>
<span style="font-size:16px;color:#6B5A4E">{{l.opt}}</span>
</div>
<button style="height:48px;padding:0 16px;border:1px solid #DCCFC2;border-radius:24px;background:#FFFFFF;font-family:inherit;font-size:16px;color:#2B1D16">옵션 변경</button>
<div style="display:flex;align-items:center;gap:8px">
<button aria-label="수량 줄이기" style="width:48px;height:48px;border:1px solid #DCCFC2;border-radius:12px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:22px;color:#2B1D16">−</button>
<span style="min-width:28px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700">1</span>
<button aria-label="수량 늘리기" style="width:48px;height:48px;border:1px solid #DCCFC2;border-radius:12px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:22px;color:#2B1D16">+</button>
</div>
<span style="width:110px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700">{{l.total}}원</span>
</div>
</sc-for>
</div>

<div style="width:360px;flex:none;box-sizing:border-box;background:#FFFFFF;border:1px solid #E5DACE;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px">
<span style="font-size:22px;font-weight:700">결제 예정</span>
<div style="display:flex;justify-content:space-between;font-size:19px"><span style="color:#6B5A4E">음료 3잔</span><span style="font-family:'JetBrains Mono',monospace">16,600원</span></div>
<div style="display:flex;justify-content:space-between;font-size:19px"><span style="color:#6B5A4E">무료 쿠폰</span><span style="font-family:'JetBrains Mono',monospace">결제 때 확인</span></div>
<div style="height:1px;background:#E5DACE"></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:22px;font-weight:700">결제 금액</span><span style="font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;color:#5A3A28">16,600원</span></div>
<div style="box-sizing:border-box;border-radius:14px;background:#E3F7F2;padding:14px 16px;font-size:17px;line-height:26px;color:#00473A">결제할 때 전화번호를 넣으면 <b>스탬프 3개</b>가 쌓여요</div>
<div style="flex:1"></div>
<button style="height:64px;border:2px solid #5A3A28;border-radius:16px;background:#FFFFFF;color:#5A3A28;font-family:inherit;font-size:21px;font-weight:700">더 담기</button>
<a href="sw-04-pay.dc.html" style="height:72px;box-sizing:border-box;border-radius:18px;background:#5A3A28;color:#FFFFFF;font-size:23px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">결제하기 ›</a>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const hot = { tempBg: '#FDE8E6', tempInk: '#8F1D14' };
    const ice = { tempBg: '#E5EDFD', tempInk: '#1D3FA8' };
    return {
      lines: [
        { name: '아메리카노', temp: 'ICE', ...ice, opt: '톨 · 샷 기본 · 얼음 보통 · 매장 컵', total: '4,700', tint: '#EADBCB' },
        { name: '카페 라떼', temp: 'ICE', ...ice, opt: '그란데 · 시럽 없음 · 매장 컵', total: '5,800', tint: '#F1E6DA' },
        { name: '말차 라떼', temp: 'HOT', ...hot, opt: '톨 · 매장 컵', total: '6,100', tint: '#DCEAD6' }
      ]
    };
  }
}
</script>
</body>
</html>
