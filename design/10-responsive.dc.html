<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 반응형 구간과 폰트 기준</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1200px;height:720px;box-sizing:border-box;background:#FFFFFF;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;padding:40px 48px;display:flex;flex-direction:column;gap:22px;overflow:hidden">

<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:36px;font-weight:700;line-height:48px">카페 · 반응형 구간 · 폰트 기준</span>
<span style="font-size:18px;color:#6B5A4E">화면 설계는 태블릿 구간(세로 800×1280) 기준 · 스탬프 키패드와 옵션 버튼 행 추가</span>
</div>

<div style="display:flex;flex-direction:column;border:1px solid #E5DACE;border-radius:16px;overflow:hidden">
<div style="display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));height:52px;background:#2B1D16;color:#FFFFFF;font-size:18px;font-weight:700;align-items:center">
<span style="padding:0 20px">항목</span>
<span style="padding:0 20px">모바일 (~767)</span>
<span style="padding:0 20px;background:#5A3A28;height:52px;display:flex;align-items:center">태블릿 (768~1199) 기준</span>
<span style="padding:0 20px">데스크탑 (1200~)</span>
</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="9">
<div style="display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));min-height:42px;border-top:1px solid #E5DACE;align-items:stretch;font-size:17px">
<span style="padding:9px 20px;color:#6B5A4E;font-weight:500;display:flex;align-items:center">{{row.label}}</span>
<span style="padding:9px 20px;display:flex;align-items:center;font-family:{{row.font}}">{{row.c1}}</span>
<span style="padding:9px 20px;display:flex;align-items:center;background:#F7EFE6;font-weight:700;font-family:{{row.font}}">{{row.c2}}</span>
<span style="padding:9px 20px;display:flex;align-items:center;font-family:{{row.font}}">{{row.c3}}</span>
</div>
</sc-for>
</div>

<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
<span style="font-size:17px;color:#6B5A4E;margin-right:4px">색상</span>
<span style="display:flex;align-items:center;gap:8px"><span style="width:28px;height:28px;border-radius:8px;background:#2B1D16"></span><span style="font-family:'JetBrains Mono',monospace;font-size:15px">#2B1D16 에스프레소</span></span>
<span style="display:flex;align-items:center;gap:8px"><span style="width:28px;height:28px;border-radius:8px;background:#5A3A28"></span><span style="font-family:'JetBrains Mono',monospace;font-size:15px">#5A3A28 버튼</span></span>
<span style="display:flex;align-items:center;gap:8px"><span style="width:28px;height:28px;border-radius:8px;background:#007A64"></span><span style="font-family:'JetBrains Mono',monospace;font-size:15px">#007A64 스탬프</span></span>
<span style="display:flex;align-items:center;gap:8px"><span style="width:28px;height:28px;border-radius:8px;background:#2563EB"></span><span style="font-family:'JetBrains Mono',monospace;font-size:15px">#2563EB 더치페이</span></span>
<span style="display:flex;align-items:center;gap:8px"><span style="width:28px;height:28px;border-radius:8px;background:#F59E0B"></span><span style="font-family:'JetBrains Mono',monospace;font-size:15px">#F59E0B 새 스탬프</span></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const t = "'Noto Sans KR',sans-serif";
    const m = "'JetBrains Mono','Noto Sans KR',monospace";
    return {
      rows: [
        { label: '주 용도', font: t, c1: 'QR 주문 · 스탬프 조회', c2: '매장 키오스크 (세로)', c3: '대형 키오스크 · 관리자' },
        { label: '메뉴 그리드', font: t, c1: '2열', c2: '3열', c3: '4열' },
        { label: '제목', font: m, c1: '24px', c2: '34px', c3: '40px' },
        { label: '본문', font: m, c1: '16px', c2: '20px', c3: '22px' },
        { label: '음료명', font: m, c1: '17px', c2: '21px', c3: '24px' },
        { label: '가격', font: m, c1: '18px', c2: '22~24px', c3: '26px' },
        { label: '옵션 버튼', font: m, c1: '16px · 높이 48', c2: '19px · 높이 56', c3: '20px · 높이 64' },
        { label: '전화번호 키패드', font: m, c1: '26px · 높이 64', c2: '32px · 높이 76', c3: '34px · 높이 84' },
        { label: '최소 터치 영역', font: m, c1: '48px', c2: '56~64px', c3: '72px' }
      ]
    };
  }
}
</script>
</body>
</html>
