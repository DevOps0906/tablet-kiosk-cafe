<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 메뉴 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:800px;height:1280px;box-sizing:border-box;background:#F7F3EE;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:96px;flex:none;box-sizing:border-box;padding:0 32px;background:#2B1D16;display:flex;align-items:center;justify-content:space-between">
<span style="font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:1px;color:#F7F3EE">[카페명]</span>
<span style="height:48px;padding:0 18px;border-radius:24px;background:#00C9A7;color:#04342C;font-size:18px;font-weight:700;display:flex;align-items:center">스탬프 10개 = 커피 1잔</span>
</div>

<div style="flex:none;box-sizing:border-box;padding:20px 32px 8px;display:flex;align-items:center;gap:16px">
<div role="tablist" aria-label="매장 또는 포장" style="flex:1;height:64px;box-sizing:border-box;padding:4px;border-radius:18px;background:#E9E0D6;display:flex;gap:4px">
<button role="tab" aria-selected="{{dineSel}}" style="flex:1;border:0;border-radius:14px;background:{{dineBg}};color:{{dineInk}};font-family:inherit;font-size:22px;font-weight:700">매장</button>
<button role="tab" aria-selected="{{takeSel}}" style="flex:1;border:0;border-radius:14px;background:{{takeBg}};color:{{takeInk}};font-family:inherit;font-size:22px;font-weight:700">포장</button>
</div>
<span style="flex:none;font-size:18px;color:#6B5A4E">주문서에 인쇄</span>
</div>

<div style="flex:none;box-sizing:border-box;padding:8px 32px 12px;display:flex;gap:10px">
<button style="height:56px;padding:0 22px;border:0;border-radius:28px;background:#2B1D16;color:#F7F3EE;font-family:inherit;font-size:20px;font-weight:700">추천</button>
<button style="height:56px;padding:0 22px;border:1px solid #DCCFC2;border-radius:28px;background:#FFFFFF;color:#2B1D16;font-family:inherit;font-size:20px;font-weight:500">에스프레소</button>
<button style="height:56px;padding:0 22px;border:1px solid #DCCFC2;border-radius:28px;background:#FFFFFF;color:#2B1D16;font-family:inherit;font-size:20px;font-weight:500">콜드브루</button>
<button style="height:56px;padding:0 22px;border:1px solid #DCCFC2;border-radius:28px;background:#FFFFFF;color:#2B1D16;font-family:inherit;font-size:20px;font-weight:500">블렌디드</button>
<button style="height:56px;padding:0 22px;border:1px solid #DCCFC2;border-radius:28px;background:#FFFFFF;color:#2B1D16;font-family:inherit;font-size:20px;font-weight:500">티</button>
<button style="height:56px;padding:0 22px;border:1px solid #DCCFC2;border-radius:28px;background:#FFFFFF;color:#2B1D16;font-family:inherit;font-size:20px;font-weight:500">푸드</button>
</div>

<div style="flex:1;min-height:0;box-sizing:border-box;padding:12px 32px 24px;overflow:hidden">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="9">
<div style="position:relative;box-sizing:border-box;background:#FFFFFF;border:1px solid #E5DACE;border-radius:20px;overflow:hidden">
<div style="height:160px;background:{{item.tint}};display:flex;align-items:center;justify-content:center;font-size:16px;color:#6B5A4E">음료 사진</div>
<sc-if value="{{item.hasQty}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:20px;background:#2B1D16;color:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center">{{item.qty}}</div>
</sc-if>
<div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px">
<div style="font-size:21px;font-weight:700;line-height:28px">{{item.name}}</div>
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700">{{item.price}}원</span>
<span style="font-size:15px;font-weight:700;color:{{item.tempInk}}">{{item.temp}}</span>
</div>
</div>
</div>
</sc-for>
</div>
</div>

<div style="height:160px;flex:none;box-sizing:border-box;padding:0 32px;background:#FFFFFF;border-top:1px solid #E5DACE;display:flex;align-items:center;justify-content:space-between;gap:24px">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:20px;color:#6B5A4E">음료 3잔 · 스탬프 +3 예정</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;line-height:52px">16,600원</span>
</div>
<button style="width:300px;height:88px;border:0;border-radius:20px;background:#5A3A28;color:#FFFFFF;font-family:inherit;font-size:26px;font-weight:700">주문 확인 ›</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"orderType":{"editor":"enum","options":["매장","포장"],"default":"매장"},"$preview":{"width":800,"height":1280}}'>
class Component extends DCLogic {
  renderVals() {
    const dine = (this.props.orderType ?? '매장') === '매장';
    const base = [
      { name: '아메리카노', price: '4,700', tint: '#EADBCB', temp: 'HOT · ICE', qty: 1 },
      { name: '카페 라떼', price: '5,200', tint: '#F1E6DA', temp: 'HOT · ICE', qty: 1 },
      { name: '바닐라 라떼', price: '5,700', tint: '#F6EEDC', temp: 'HOT · ICE' },
      { name: '콜드브루', price: '5,200', tint: '#DDD1C6', temp: 'ICE ONLY' },
      { name: '카라멜 마키아토', price: '6,100', tint: '#F3E2C9', temp: 'HOT · ICE' },
      { name: '말차 라떼', price: '6,100', tint: '#DCEAD6', temp: 'HOT · ICE', qty: 1 },
      { name: '자몽 블렌디드', price: '6,300', tint: '#FBE2DA', temp: 'ICE ONLY' },
      { name: '얼그레이 티', price: '4,700', tint: '#EDE3EF', temp: 'HOT · ICE' },
      { name: '크로플', price: '4,500', tint: '#F6EEDC', temp: '푸드' }
    ];
    return {
      dineSel: dine, takeSel: !dine,
      dineBg: dine ? '#5A3A28' : 'transparent', dineInk: dine ? '#FFFFFF' : '#6B5A4E',
      takeBg: dine ? 'transparent' : '#5A3A28', takeInk: dine ? '#6B5A4E' : '#FFFFFF',
      items: base.map((b) => ({
        ...b,
        hasQty: !!b.qty,
        tempInk: b.temp === 'ICE ONLY' ? '#1D4ED8' : '#6B5A4E'
      }))
    };
  }
}
</script>
</body>
</html>
