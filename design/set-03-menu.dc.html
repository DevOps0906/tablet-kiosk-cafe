<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 세팅 3 메뉴 등록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F7F3EE;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;display:flex;overflow:hidden">

<div style="width:300px;flex:none;box-sizing:border-box;background:#2B1D16;color:#FFFFFF;padding:36px 24px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;color:#00C9A7">[서비스명]</span><span style="font-size:16px;color:#D9C7B5">사장님 키오스크 설정</span></div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="height:56px;box-sizing:border-box;padding:0 14px;border-radius:14px;background:{{s.bg}};display:flex;align-items:center;gap:12px">
<span style="width:32px;height:32px;flex:none;box-sizing:border-box;border-radius:16px;background:{{s.dot}};border:{{s.ring}};color:{{s.dotInk}};font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center">{{s.mark}}</span>
<span style="font-size:18px;font-weight:{{s.weight}};color:{{s.ink}}">{{s.label}}</span>
</div>
</sc-for>
</div>
<div style="margin-top:auto;box-sizing:border-box;border-radius:14px;background:#3A2A21;padding:16px;font-size:15px;line-height:24px;color:#D9C7B5">막히면 원격으로 도와드려요<br><b style="color:#FFFFFF">[고객센터 번호]</b></div>
</div>

<div style="flex:1;box-sizing:border-box;padding:44px 56px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:17px;font-weight:700;color:#5A3A28">3 / 5</span>
<span style="font-size:32px;font-weight:700;line-height:42px">메뉴 · 음료 옵션 등록</span>
</div>
<button style="height:56px;padding:0 22px;border:0;border-radius:14px;background:#2B1D16;color:#FFFFFF;font-family:inherit;font-size:18px;font-weight:700">메뉴판 사진으로 한 번에 등록</button>
</div>

<div style="flex:1;min-height:0;display:flex;gap:24px">

<div style="width:380px;flex:none;box-sizing:border-box;background:#FFFFFF;border:1px solid #E5DACE;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<span style="height:38px;padding:0 14px;border-radius:19px;background:#2B1D16;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center">커피 6</span>
<span style="height:38px;padding:0 14px;border-radius:19px;border:1px solid #DCCFC2;box-sizing:border-box;font-size:16px;display:flex;align-items:center">음료 4</span>
<span style="height:38px;padding:0 14px;border-radius:19px;border:1px solid #DCCFC2;box-sizing:border-box;font-size:16px;display:flex;align-items:center">디저트 3</span>
<span style="height:38px;padding:0 14px;border-radius:19px;border:1px solid #DCCFC2;box-sizing:border-box;font-size:16px;display:flex;align-items:center">+ 분류</span>
</div>
<sc-for list="{{menus}}" as="m" hint-placeholder-count="4">
<div style="height:72px;box-sizing:border-box;border-radius:14px;border:{{m.border}};background:{{m.bg}};padding:0 14px;display:flex;align-items:center;gap:12px">
<span style="width:48px;height:48px;flex:none;border-radius:10px;background:{{m.tint}}"></span>
<div style="flex:1;display:flex;flex-direction:column"><span style="font-size:18px;font-weight:700">{{m.name}}</span><span style="font-size:14px;color:#6B5A4E">{{m.unit}}</span></div>
<span style="font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700">{{m.price}}</span>
</div>
</sc-for>
<button style="height:52px;border:2px dashed #A8988B;border-radius:14px;background:#FFFFFF;font-family:inherit;font-size:17px;font-weight:700;color:#3A2418">+ 메뉴 추가</button>
</div>

<div style="flex:1;min-width:0;box-sizing:border-box;background:#FFFFFF;border:2px solid #5A3A28;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:16px">
<div style="width:110px;height:110px;flex:none;box-sizing:border-box;border-radius:14px;background:#EADBCB;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px"><span style="height:30px;padding:0 10px;border-radius:15px;background:#2B1D16;color:#FFFFFF;font-size:14px;font-weight:700;display:flex;align-items:center">사진 찍기</span></div>
<div style="flex:1;display:flex;flex-direction:column;gap:10px">
<label style="display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700;color:#6B5A4E">메뉴 이름<input readonly value="아메리카노" style="height:48px;box-sizing:border-box;border:2px solid #DCCFC2;border-radius:12px;padding:0 12px;font-family:inherit;font-size:19px;color:#2B1D16"></label>
<label style="display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700;color:#6B5A4E">기본 가격 (톨)<input readonly value="4,700" style="height:48px;box-sizing:border-box;border:2px solid #DCCFC2;border-radius:12px;padding:0 12px;font-family:'JetBrains Mono',monospace;font-size:19px;color:#2B1D16"></label>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:16px;font-weight:700">옵션 (손님 화면에 그대로 나와요)</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="height:38px;padding:0 12px;border-radius:10px;background:#F7EFE6;color:#3A2418;font-size:15px;font-weight:700;display:flex;align-items:center">HOT · ICE</span>
<span style="height:38px;padding:0 12px;border-radius:10px;background:#F7EFE6;color:#3A2418;font-size:15px;font-weight:700;display:flex;align-items:center">그란데 +600</span>
<span style="height:38px;padding:0 12px;border-radius:10px;background:#F7EFE6;color:#3A2418;font-size:15px;font-weight:700;display:flex;align-items:center">벤티 +1,200</span>
<span style="height:38px;padding:0 12px;border-radius:10px;background:#F7EFE6;color:#3A2418;font-size:15px;font-weight:700;display:flex;align-items:center">샷 추가 +600</span>
<span style="height:38px;padding:0 12px;border-radius:10px;background:#F7EFE6;color:#3A2418;font-size:15px;font-weight:700;display:flex;align-items:center">시럽 +600</span>
<span style="height:38px;padding:0 12px;border-radius:10px;background:#F7EFE6;color:#3A2418;font-size:15px;font-weight:700;display:flex;align-items:center">얼음 양</span>
<span style="height:38px;padding:0 12px;border-radius:10px;background:#F7EFE6;color:#3A2418;font-size:15px;font-weight:700;display:flex;align-items:center">컵 선택</span>
<span style="height:38px;padding:0 12px;border-radius:10px;border:1px dashed #A8988B;box-sizing:border-box;font-size:15px;display:flex;align-items:center">+ 옵션</span>
</div></div>
<div style="margin-top:auto;display:flex;align-items:center;gap:10px"><span style="height:44px;padding:0 16px;border-radius:12px;background:#E3F7F2;color:#00473A;font-size:16px;font-weight:700;display:flex;align-items:center">✓ 스탬프 적립 대상</span><span style="height:44px;padding:0 16px;border-radius:12px;background:#F7F3EE;font-size:16px;display:flex;align-items:center">주문서 출력</span><span style="flex:1"></span><button style="height:44px;padding:0 20px;border:0;border-radius:12px;background:#5A3A28;color:#FFFFFF;font-family:inherit;font-size:17px;font-weight:700">저장</button></div>
</div>

</div>

<div style="display:flex;justify-content:flex-end;gap:14px">
<a href="set-02-store.dc.html" style="height:60px;box-sizing:border-box;padding:0 28px;border:2px solid #DCCFC2;border-radius:16px;background:#FFFFFF;color:#2B1D16;font-size:20px;font-weight:700;text-decoration:none;display:flex;align-items:center">‹ 이전</a>
<a href="set-04-devices.dc.html" style="height:60px;box-sizing:border-box;padding:0 36px;border-radius:16px;background:#5A3A28;color:#FFFFFF;font-size:20px;font-weight:700;text-decoration:none;display:flex;align-items:center">다음 · 기기 연결 ›</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 3;
    const labels = ['사장님 시작', '매장 정보', '메뉴 등록', '기기 연결', '키오스크 모드'];
    const src = [
      { name: '아메리카노', unit: 'HOT · ICE · 사이즈 3', price: '4,700', tint: '#EADBCB', on: true },
      { name: '카페 라떼', unit: 'HOT · ICE · 사이즈 3', price: '5,200', tint: '#F1E6DA' },
      { name: '바닐라 라떼', unit: 'HOT · ICE · 시럽 포함', price: '5,700', tint: '#F6EEDC' },
      { name: '콜드브루', unit: 'ICE 전용', price: '5,200', tint: '#DDD1C6' }
    ];
    return {
      menus: src.map((m) => ({ ...m, border: m.on ? '2px solid #5A3A28' : '1px solid #EFE6DC', bg: m.on ? '#F7EFE6' : '#FFFFFF' })),
      steps: labels.map((label, i) => {
        const n = i + 1, done = n < cur, now = n === cur;
        return {
          label, mark: done ? '✓' : String(n),
          bg: now ? '#5A3A28' : 'transparent',
          dot: done ? '#00C9A7' : now ? '#FFFFFF' : 'transparent',
          ring: done || now ? '0' : '2px solid #6B5A4E',
          dotInk: done ? '#04342C' : now ? '#5A3A28' : '#A8988B',
          ink: done || now ? '#FFFFFF' : '#A8988B',
          weight: now ? '700' : '400'
        };
      })
    };
  }
}
</script>
</body>
</html>
