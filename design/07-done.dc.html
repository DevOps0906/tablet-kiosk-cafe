<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 주문 완료 스탬프 주문서</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:800px;height:1280px;box-sizing:border-box;background:#F7F3EE;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden">

<div style="flex:none;width:100%;box-sizing:border-box;padding:56px 32px 0;display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="width:96px;height:96px;border-radius:48px;background:#5A3A28;display:flex;align-items:center;justify-content:center">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</div>
<span style="font-size:34px;font-weight:700;line-height:44px">주문이 접수되었어요</span>
</div>

<div style="flex:none;box-sizing:border-box;margin-top:24px;width:560px;padding:20px 0;border-radius:24px;background:#FFFFFF;border:1px solid #E5DACE;display:flex;flex-direction:column;align-items:center;gap:4px">
<span style="font-size:20px;color:#6B5A4E">매장 · 주문번호</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:84px;font-weight:700;line-height:96px;color:#5A3A28">C-042</span>
<span style="font-size:18px;color:#6B5A4E">음료가 준비되면 번호를 불러 드려요</span>
</div>

<div style="flex:none;box-sizing:border-box;margin-top:20px;width:736px;border-radius:20px;background:#E3F7F2;border:2px solid #00C9A7;padding:20px 24px;display:flex;align-items:center;gap:20px">
<div style="width:88px;height:88px;flex:none;border-radius:20px;background:#007A64;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFFFFF">
<span style="font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;line-height:34px">10</span>
<span style="font-size:14px">/10</span>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:4px">
<span style="font-size:23px;font-weight:700;color:#00473A">스탬프 +3 · 10개 달성!</span>
<span style="font-size:18px;line-height:26px;color:#00473A">커피 1잔 무료 쿠폰을 010-****-5678로 보냈어요. 다음 주문 때 번호만 입력하면 써요. 스탬프는 0개부터 다시 쌓여요.</span>
</div>
</div>

<div style="flex:none;margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:10px">
<span style="font-size:17px;color:#6B5A4E">바리스타 주문서 출력 예시</span>
<div style="box-sizing:border-box;width:400px;background:#FFFFFF;border:1px solid #DCCFC2;border-radius:4px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono','Noto Sans KR',monospace;font-size:18px;line-height:26px">
<div style="display:flex;justify-content:space-between;align-items:center;font-weight:700"><span style="font-size:24px">C-042</span><span style="box-sizing:border-box;border:3px solid #2B1D16;padding:2px 14px;font-size:30px;line-height:40px">매장</span></div>
<div style="border-top:2px dashed #A8988B"></div>
<div style="display:flex;justify-content:space-between;font-weight:700"><span>아메리카노 ICE 톨</span><span>x1</span></div>
<div style="font-size:16px;color:#6B5A4E;padding-left:12px">· 얼음 보통 · 매장 컵</div>
<div style="display:flex;justify-content:space-between;font-weight:700"><span>카페 라떼 ICE 그란데</span><span>x1</span></div>
<div style="font-size:16px;color:#6B5A4E;padding-left:12px">· 시럽 없음 · 매장 컵</div>
<div style="display:flex;justify-content:space-between;font-weight:700"><span>말차 라떼 HOT 톨</span><span>x1</span></div>
<div style="border-top:2px dashed #A8988B"></div>
<div style="display:flex;justify-content:space-between;font-size:16px;color:#6B5A4E"><span>스탬프 +3 · 전체결제</span><span>접수 09:12</span></div>
</div>
</div>

<div style="flex:1"></div>

<div style="flex:none;width:100%;box-sizing:border-box;padding:0 32px 16px;text-align:center;font-size:19px;color:#6B5A4E">30초 뒤 처음 화면으로 돌아가요</div>

<div style="flex:none;width:100%;box-sizing:border-box;padding:0 32px 36px;display:flex;gap:16px">
<button style="flex:1;height:88px;border:2px solid #5A3A28;border-radius:20px;background:#FFFFFF;color:#5A3A28;font-family:inherit;font-size:26px;font-weight:700">영수증 출력</button>
<button style="flex:1;height:88px;border:0;border-radius:20px;background:#5A3A28;color:#FFFFFF;font-family:inherit;font-size:26px;font-weight:700">처음으로</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":1280}}'>

</body>
</html>
