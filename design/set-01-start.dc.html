<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 세팅 1 사장님 시작</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F7F3EE;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;display:flex;overflow:hidden">

<div style="width:300px;flex:none;box-sizing:border-box;background:#2B1D16;color:#FFFFFF;padding:36px 24px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;color:#00C9A7">[서비스명]</span><span style="font-size:16px;color:#D9C7B5">사장님 키오스크 설정</span></div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="height:56px;box-sizing:border-box;padding:0 14px;border-radius:14px;background:{{s.bg}};display:flex;align-items:center;gap:12px">
<span style="width:32px;height:32px;flex:none;box-sizing:border-box;border-radius:16px;background:{{s.dot}};border:{{s.ring}};color:{{s.dotInk}};font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center">{{s.mark}}</span>
<span style="font-size:18px;font-weight:{{s.weight}};color:{{s.ink}}">{{s.label}}</span>
</div>
</sc-for>
</div>
<div style="margin-top:auto;box-sizing:border-box;border-radius:14px;background:#3A2A21;padding:16px;font-size:15px;line-height:24px;color:#D9C7B5">막히면 원격으로 도와드려요<br><b style="color:#FFFFFF">[고객센터 번호]</b></div>
</div>

<div style="flex:1;box-sizing:border-box;padding:56px 72px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-size:17px;font-weight:700;color:#5A3A28">1 / 5 · 갤럭시탭 가로 1280×800</span>
<span style="font-size:34px;font-weight:700;line-height:44px">사장님, 우리 카페 키오스크를 만들어요</span>
<span style="font-size:19px;color:#6B5A4E">카운터 태블릿 한 대로 주문 · 결제 · 스탬프 적립 · 주문서 출력까지 됩니다.</span>
</div>

<div style="display:flex;gap:20px">
<button style="flex:1;height:150px;box-sizing:border-box;border:3px solid #5A3A28;border-radius:22px;background:#F7EFE6;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;padding:0 28px;text-align:left;font-family:inherit;color:#2B1D16">
<span style="font-size:24px;font-weight:700">처음 시작해요</span><span style="font-size:17px;color:#5A3A28">휴대폰 번호로 사장님 계정 만들기</span></button>
<button style="flex:1;height:150px;box-sizing:border-box;border:2px solid #DCCFC2;border-radius:22px;background:#FFFFFF;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;padding:0 28px;text-align:left;font-family:inherit;color:#2B1D16">
<span style="font-size:24px;font-weight:700">이미 계정이 있어요</span><span style="font-size:17px;color:#6B5A4E">기존 스탬프 회원 그대로 이어서 사용</span></button>
</div>

<div style="display:flex;flex-direction:column;gap:10px;max-width:620px">
<label for="ownerPhone" style="font-size:19px;font-weight:700">사장님 휴대폰 번호</label>
<div style="display:flex;gap:12px">
<input id="ownerPhone" readonly value="010-3456-7890" style="flex:1;height:60px;box-sizing:border-box;border:2px solid #5A3A28;border-radius:14px;background:#FFFFFF;padding:0 18px;font-family:'JetBrains Mono',monospace;font-size:22px;color:#2B1D16">
<button style="height:60px;padding:0 22px;border:0;border-radius:14px;background:#2B1D16;color:#FFFFFF;font-family:inherit;font-size:18px;font-weight:700">인증번호 받기</button>
</div>
</div>

<div style="box-sizing:border-box;border-radius:16px;background:#FFFFFF;border:1px solid #E5DACE;padding:18px 22px;display:flex;flex-direction:column;gap:6px;max-width:820px">
<span style="font-size:18px;font-weight:700">준비물 (나중에 넣어도 돼요)</span>
<span style="font-size:17px;line-height:26px;color:#3A2418">· 사업자등록번호 — 카드 결제 가맹 신청에 필요<br>· 종이 스탬프 쿠폰을 쓰셨다면 — 단골 번호를 옮겨 올 수 있어요</span>
</div>

<div style="margin-top:auto;display:flex;justify-content:flex-end">
<a href="set-02-store.dc.html" style="height:64px;box-sizing:border-box;padding:0 40px;border-radius:16px;background:#5A3A28;color:#FFFFFF;font-size:21px;font-weight:700;text-decoration:none;display:flex;align-items:center">다음 · 매장 정보 ›</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 1;
    const labels = ['사장님 시작', '매장 정보', '메뉴 등록', '기기 연결', '키오스크 모드'];
    return {
      steps: labels.map((label, i) => {
        const n = i + 1, done = n < cur, now = n === cur;
        return {
          label, mark: done ? '✓' : String(n),
          bg: now ? '#5A3A28' : 'transparent',
          dot: done ? '#00C9A7' : now ? '#FFFFFF' : 'transparent',
          ring: done || now ? '0' : '2px solid #6B5A4E',
          dotInk: done ? '#04342C' : now ? '#5A3A28' : '#A8988B',
          ink: done || now ? '#FFFFFF' : '#A8988B',
          weight: now ? '700' : '400'
        };
      })
    };
  }
}
</script>
</body>
</html>
