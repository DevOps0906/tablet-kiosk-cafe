<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카페 세팅 2 매장 정보</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F7F3EE;color:#2B1D16;font-family:'Noto Sans KR',sans-serif;display:flex;overflow:hidden">

<div style="width:300px;flex:none;box-sizing:border-box;background:#2B1D16;color:#FFFFFF;padding:36px 24px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;color:#00C9A7">[서비스명]</span><span style="font-size:16px;color:#D9C7B5">사장님 키오스크 설정</span></div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="height:56px;box-sizing:border-box;padding:0 14px;border-radius:14px;background:{{s.bg}};display:flex;align-items:center;gap:12px">
<span style="width:32px;height:32px;flex:none;box-sizing:border-box;border-radius:16px;background:{{s.dot}};border:{{s.ring}};color:{{s.dotInk}};font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center">{{s.mark}}</span>
<span style="font-size:18px;font-weight:{{s.weight}};color:{{s.ink}}">{{s.label}}</span>
</div>
</sc-for>
</div>
<div style="margin-top:auto;box-sizing:border-box;border-radius:14px;background:#3A2A21;padding:16px;font-size:15px;line-height:24px;color:#D9C7B5">막히면 원격으로 도와드려요<br><b style="color:#FFFFFF">[고객센터 번호]</b></div>
</div>

<div style="flex:1;box-sizing:border-box;padding:44px 56px;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:17px;font-weight:700;color:#5A3A28">2 / 5</span>
<span style="font-size:32px;font-weight:700;line-height:42px">손님에게 보일 우리 카페 정보</span>
</div>

<div style="flex:1;min-height:0;display:flex;gap:32px">
<div style="flex:1;display:flex;flex-direction:column;gap:18px">
<label style="display:flex;flex-direction:column;gap:8px;font-size:18px;font-weight:700">카페 이름<input readonly value="[카페 이름] 커피" style="height:56px;box-sizing:border-box;border:2px solid #5A3A28;border-radius:14px;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:20px;font-weight:400;color:#2B1D16"></label>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:18px;font-weight:700">업종</span>
<div style="display:flex;gap:10px">
<button style="height:48px;padding:0 20px;border:2px solid #DCCFC2;border-radius:24px;background:#FFFFFF;font-family:inherit;font-size:18px;color:#2B1D16">식당</button>
<button aria-pressed="true" style="height:48px;padding:0 20px;border:0;border-radius:24px;background:#5A3A28;color:#FFFFFF;font-family:inherit;font-size:18px;font-weight:700">카페</button>
<button style="height:48px;padding:0 20px;border:2px solid #DCCFC2;border-radius:24px;background:#FFFFFF;font-family:inherit;font-size:18px;color:#2B1D16">버거 · 분식</button>
<button style="height:48px;padding:0 20px;border:2px solid #DCCFC2;border-radius:24px;background:#FFFFFF;font-family:inherit;font-size:18px;color:#2B1D16">기타</button>
</div></div>
<div style="display:flex;gap:14px">
<button style="flex:1;height:96px;box-sizing:border-box;border:2px dashed #A8988B;border-radius:16px;background:#FFFFFF;font-family:inherit;color:#3A2418;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span style="font-size:18px;font-weight:700">로고 올리기</span><span style="font-size:15px;color:#6B5A4E">컵 홀더 · 간판 로고</span></button>
<button style="flex:1;height:96px;box-sizing:border-box;border:2px dashed #A8988B;border-radius:16px;background:#FFFFFF;font-family:inherit;color:#3A2418;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span style="font-size:18px;font-weight:700">가게 사진 찍기</span><span style="font-size:15px;color:#6B5A4E">시작 화면 배경</span></button>
</div>
<div style="display:flex;gap:24px">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:18px;font-weight:700">주문 방식</span><div style="display:flex;gap:8px"><span style="height:44px;padding:0 16px;border-radius:12px;background:#F7EFE6;color:#3A2418;font-size:17px;font-weight:700;display:flex;align-items:center">✓ 매장</span><span style="height:44px;padding:0 16px;border-radius:12px;background:#F7EFE6;color:#3A2418;font-size:17px;font-weight:700;display:flex;align-items:center">✓ 포장</span></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:18px;font-weight:700">음료 호출</span><div style="display:flex;gap:8px"><span style="height:44px;padding:0 16px;border-radius:12px;background:#F7EFE6;color:#3A2418;font-size:17px;font-weight:700;display:flex;align-items:center">주문번호 부르기</span></div></div>
</div>
</div>

<div style="width:380px;flex:none;display:flex;flex-direction:column;gap:10px">
<span style="font-size:16px;font-weight:700;color:#6B5A4E">미리보기 · 손님 시작 화면</span>
<div style="height:238px;box-sizing:border-box;border-radius:16px;border:8px solid #2B1D16;overflow:hidden;display:flex">
<div style="flex:1;background:#5C4A3E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span style="width:44px;height:44px;border-radius:22px;background:#F7F3EE;color:#2B1D16;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">로고</span><span style="font-size:14px;font-weight:700;color:#FFFFFF">[카페 이름] 커피</span><span style="font-size:11px;color:#D9C7B5">스탬프 10개 = 1잔</span></div>
<div style="flex:1;background:#F7F3EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px"><span style="font-size:12px;font-weight:700">어디서 드시나요?</span><div style="display:flex;gap:6px"><span style="width:56px;height:56px;border-radius:8px;background:#5A3A28;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">매장</span><span style="width:56px;height:56px;border-radius:8px;border:2px solid #DCCFC2;box-sizing:border-box;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">포장</span></div></div>
</div>
<span style="font-size:15px;line-height:22px;color:#6B5A4E">우리 카페 분위기 그대로 보여주세요. 사진과 로고만 바꾸면 바로 반영돼요.</span>
</div>
</div>

<div style="display:flex;justify-content:flex-end;gap:14px">
<a href="set-01-start.dc.html" style="height:60px;box-sizing:border-box;padding:0 28px;border:2px solid #DCCFC2;border-radius:16px;background:#FFFFFF;color:#2B1D16;font-size:20px;font-weight:700;text-decoration:none;display:flex;align-items:center">‹ 이전</a>
<a href="set-03-menu.dc.html" style="height:60px;box-sizing:border-box;padding:0 36px;border-radius:16px;background:#5A3A28;color:#FFFFFF;font-size:20px;font-weight:700;text-decoration:none;display:flex;align-items:center">다음 · 메뉴 등록 ›</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 2;
    const labels = ['사장님 시작', '매장 정보', '메뉴 등록', '기기 연결', '키오스크 모드'];
    return {
      steps: labels.map((label, i) => {
        const n = i + 1, done = n < cur, now = n === cur;
        return {
          label, mark: done ? '✓' : String(n),
          bg: now ? '#5A3A28' : 'transparent',
          dot: done ? '#00C9A7' : now ? '#FFFFFF' : 'transparent',
          ring: done || now ? '0' : '2px solid #6B5A4E',
          dotInk: done ? '#04342C' : now ? '#5A3A28' : '#A8988B',
          ink: done || now ? '#FFFFFF' : '#A8988B',
          weight: now ? '700' : '400'
        };
      })
    };
  }
}
</script>
</body>
</html>
